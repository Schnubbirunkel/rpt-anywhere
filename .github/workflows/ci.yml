name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install pyflakes
      - name: Byte-compile (Python 3.9+ syntax)
        run: python -m compileall -q rpt_anywhere tools
      - name: Lint
        run: python -m pyflakes rpt_anywhere tools | grep -v "imported but unused" | tee lint.txt; test ! -s lint.txt
      - name: Translations complete
        run: python tools/i18n_check.py
      - name: Shell scripts
        run: bash -n bin/rpt-anywhere install.sh uninstall.sh
